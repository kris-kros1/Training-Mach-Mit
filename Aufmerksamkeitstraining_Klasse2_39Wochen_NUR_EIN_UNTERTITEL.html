<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aufmerksamkeitstraining Klasse 2 · 2×15 Minuten</title>
<style>:root{--ink:#18232a;--muted:#607078;--yellow:#ffd43b;--blue:#dff1ff;--green:#e6f5dc;--orange:#ffe7c2;--pink:#ffe3ed;--line:#dce4e8}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif;color:var(--ink);background:#f4f6f7}.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh}aside{background:#252b2f;color:#fff;padding:20px 13px;overflow:auto;height:100vh;position:sticky;top:0}.brand{font-weight:950;font-size:20px;padding:0 8px 15px}.brand small{display:block;font-size:12px;color:#cbd3d6;margin-top:5px}.week{width:100%;border:0;background:transparent;color:#eef2f3;text-align:left;padding:9px 10px;border-radius:10px;font-weight:800;cursor:pointer}.week:hover,.week.active{background:#3b4449}main{padding:20px}.card{max-width:1180px;margin:auto;background:white;border-radius:24px;padding:26px;min-height:720px;box-shadow:0 12px 35px #00000014}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.kicker{font-size:13px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(29px,4vw,48px);margin:13px 0 5px;line-height:1.05}.sub{font-size:17px;color:var(--muted);font-weight:750}.material{display:inline-block;margin-top:15px;background:#eef2f3;border-radius:12px;padding:9px 14px;font-weight:850}.mission{margin:18px 0 10px;text-align:center;font-size:clamp(22px,2.8vw,34px);font-weight:1000}.problem{border:3px solid #20282d;border-radius:24px;padding:22px;background:linear-gradient(180deg,#fffdf5,#fff);text-align:center}.instruction{font-size:clamp(21px,2.6vw,32px);font-weight:950;margin:5px auto 16px;max-width:950px}.visual{min-height:290px;border-radius:18px;background:#f4f7f8;padding:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.scene{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:min(850px,100%);font-size:clamp(25px,4vw,46px)}.tile{background:white;border:1px solid #e2e7e9;border-radius:12px;padding:8px}.bigseq{font-size:clamp(35px,6vw,72px);letter-spacing:12px;line-height:1.5}.words{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}.word{font-size:clamp(20px,3vw,34px);font-weight:900;background:white;padding:12px 17px;border-radius:14px;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(7,52px);gap:7px}.cell{width:52px;height:52px;display:grid;place-items:center;background:#fff;border:1px solid #d8e0e4;border-radius:9px;font-size:28px;font-weight:900}.teacher{margin-top:12px;padding:12px 15px;border-radius:14px;background:var(--blue);font-size:15px}.answer{display:none;margin-top:10px;padding:12px;border-radius:12px;background:var(--green);font-weight:850}.controls{display:flex;justify-content:space-between;gap:9px;margin-top:18px;flex-wrap:wrap}.right{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:900;cursor:pointer}.primary{background:#20282d;color:#fff}.secondary{background:#edf1f3}.timer{display:flex;align-items:center;gap:8px;background:#f0f3f4;border-radius:14px;padding:8px 11px}.time{font-size:21px;font-weight:950;min-width:62px}.cover{font-size:28px;font-weight:950;color:#65737a}.focusdots{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}.focusdots i{width:55px;height:55px;border-radius:50%;background:#2d3940;display:block}.stroop{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;font-size:clamp(25px,4vw,45px);font-weight:1000}.path{font-size:clamp(30px,5vw,60px);line-height:1.6}.breath{font-size:clamp(32px,5vw,62px)}@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}main{padding:8px}.card{padding:17px;min-height:auto}.grid{grid-template-columns:repeat(7,38px)}.cell{width:38px;height:38px;font-size:22px}.visual{min-height:250px}}@media print{aside,.controls,.timer{display:none!important}main{padding:0}.card{box-shadow:none}}</style><style>
.mission{margin-top:22px;text-align:center;font-size:clamp(24px,3vw,38px);font-weight:950}

.bigseq{font-size:clamp(28px,4vw,52px);line-height:1.5;text-align:center}.cover,.path{font-size:clamp(25px,3vw,40px);font-weight:900;text-align:center;padding:35px}
.words{display:grid;gap:8px;justify-content:center}.word{font-size:30px;letter-spacing:8px}.grid{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center}.cell{height:70px;display:grid;place-items:center;border:2px solid #dce4e8;border-radius:12px;font-size:34px}.breath{font-size:90px;text-align:center}.stroop{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:45px}
@media(max-width:600px){.scene{grid-template-columns:repeat(6,1fr)}.tile{font-size:27px}}

</head><body><div class="app"><aside><div class="brand">🎯 Aufmerksamkeitstraining<small>Klasse 2 · 39 Wochen · 2 × 15 Min</small></div><div id="weeks"></div></aside><main><div class="card" id="card"></div></main></div><script>
const slides=[{"week": 1, "unit": "A", "type": "Wimmelblick", "icon": "🔎", "title": "Adleraugen", "task": "Finde im Wimmelbild 4 Dinge: 🐸, 🔑, 🍎 und 🚲. Merke dir zusätzlich, was direkt neben dem Schlüssel liegt.", "teacher": "Suche von links nach rechts. Erst nach 45 Sekunden austauschen.", "solution": "Nicht wild springen: in Bahnen suchen.", "level": 1}, {"week": 1, "unit": "B", "type": "Hördetektive", "icon": "👂", "title": "Ohren wie ein Luchs", "task": "Klatsche nur bei Tierwörtern. Bei einem Fahrzeug bleibst du ganz still.", "teacher": "Vorlesen: „Mia sieht einen Hund. Ein Bus fährt vorbei. Die Katze sitzt am Baum. Ein Fahrrad klingelt. Ein Vogel fliegt los.“", "solution": "Treffer: Hund, Katze, Vogel.", "level": 1}, {"week": 2, "unit": "A", "type": "Blitzblick", "icon": "⚡", "title": "Blinkfolge – wie in der Aufmerksamkeitsapp", "task": "Schau auf die Bildfolge. Nach 5 Sekunden wird sie verdeckt. Welche Bilder waren zu sehen?", "teacher": "Bild verdecken; danach Reihenfolge nennen. Zweite Runde rückwärts.", "solution": "🍎 – 🚲 – ⭐ – 🐸 – 🔑", "level": 1}, {"week": 2, "unit": "B", "type": "Was fehlt?", "icon": "❓", "title": "Verschwunden!", "task": "Präge dir 6 Dinge ein. Dann verdecken. Danach erscheint die Reihe ohne EIN Bild: Was fehlt?", "teacher": "Erst gemeinsam einprägen, dann „Verdecken“.", "solution": "Es fehlt der Ball.", "level": 1}, {"week": 3, "unit": "A", "type": "Stopp & Los", "icon": "🛑", "title": "Kopf vor Körper", "task": "👏 = klatschen · 👣 = Fuß tippen · 🤫 = NICHTS. Folge den Zeichen.", "teacher": "Runde 2 schneller. Runde 3: 👏 bedeutet plötzlich NICHTS.", "solution": "Fehler sind Stoppsignale: kurz neu fokussieren.", "level": 1}, {"week": 3, "unit": "B", "type": "Fehlerdetektive", "icon": "🕵️", "title": "Unikat finden", "task": "Vier Reihen sehen fast gleich aus. Welche ist anders?", "teacher": "10 Sekunden still schauen, dann Finger auf die Nase.", "solution": "In Reihe 3 steckt ◆ statt ●.", "level": 1}, {"week": 4, "unit": "A", "type": "Labyrinthblick", "icon": "🌀", "title": "Nur mit den Augen", "task": "Finde den Weg von 🐭 zum 🧀 – ohne Finger und ohne hineinrufen.", "teacher": "30 Sekunden nur mit den Augen verfolgen.", "solution": "Erst Blick planen, dann Weg beschreiben.", "level": 1}, {"week": 4, "unit": "B", "type": "Wortfilter", "icon": "🗣️", "title": "Nur wichtige Wörter", "task": "Hebe einen Finger bei einem Obstwort. Bei allen anderen Wörtern passiert nichts.", "teacher": "Vorlesen: Tisch – Apfel – Hund – Birne – Auto – Banane – Schule – Kirsche.", "solution": "4 Obstwörter.", "level": 1}, {"week": 5, "unit": "A", "type": "Reihenfolge-Profi", "icon": "🧠", "title": "Was kam wann?", "task": "Merke dir: 🐶 → ☂️ → 🍓 → 🚂 → 🌙. Danach: Was war 2.? Was kam vor dem Zug?", "teacher": "Nach 8 Sekunden verdecken.", "solution": "2. ☂️; vor 🚂 kam 🍓.", "level": 1}, {"week": 5, "unit": "B", "type": "Regelwechsel", "icon": "🔄", "title": "Farb-Falle & Regelwechsel", "task": "Runde 1: Bei 🔵 klatschen. Runde 2: Bei 🔵 still, bei 🟡 klatschen.", "teacher": "Zeige die Symbolfolge langsam, dann schneller.", "solution": "Wichtig ist der Wechsel, nicht Tempo.", "level": 1}, {"week": 6, "unit": "A", "type": "Zählfalle", "icon": "🔢", "title": "Zählen ohne Falle", "task": "Wie viele ⭐ siehst du? Achtung: Manche stehen sehr dicht beieinander.", "teacher": "20 Sekunden still zählen; Ergebnis mit Fingern zeigen.", "solution": "Systematisch Zeile für Zeile.", "level": 1}, {"week": 6, "unit": "B", "type": "Bildvergleich", "icon": "🖼️", "title": "Fast gleich", "task": "Vergleiche Bild A und B. Finde 5 Veränderungen.", "teacher": "Erst 45 Sekunden still vergleichen, dann sammeln.", "solution": "Position, Anzahl, Richtung und fehlendes Objekt beachten.", "level": 1}, {"week": 7, "unit": "A", "type": "Rhythmus-Echo", "icon": "🥁", "title": "Echo im Kopf", "task": "Lehrkraft klatscht: 👏 – Pause – 👏👏 – Pause – 👏. Wiederholt exakt.", "teacher": "3 Runden; dann längere Folge: 👏👏 / 👏 / 👏👏👏.", "solution": "Augen schließen kann helfen.", "level": 1}, {"week": 7, "unit": "B", "type": "Geheimcode", "icon": "🔐", "title": "Code knacken", "task": "★=1 · ●=2 · ▲=3. Welcher Zahlencode steckt in ★ ▲ ● ★?", "teacher": "Erst Regel merken, dann Code ohne Nachschauen sprechen.", "solution": "1–3–2–1.", "level": 1}, {"week": 8, "unit": "A", "type": "Ruhefokus", "icon": "🌿", "title": "Fokus-Insel", "task": "4 ruhige Atemzüge. Danach 30 Sekunden nur den Punkt ● ansehen.", "teacher": "Geräusche dürfen da sein. Blick und Aufmerksamkeit kehren zum Punkt zurück.", "solution": "Keine Wertung; bewusstes Zurückholen üben.", "level": 1}, {"week": 8, "unit": "B", "type": "Doppelauftrag", "icon": "🎯", "title": "Zwei Dinge im Kopf", "task": "Höre die Wörter. Zähle Tiere UND merke dir das letzte Obstwort.", "teacher": "Vorlesen: Hund – Apfel – Tisch – Katze – Birne – Bus – Vogel – Kirsche.", "solution": "3 Tiere; letztes Obst: Kirsche.", "level": 1}, {"week": 9, "unit": "A", "type": "Schattenfinder", "icon": "👤", "title": "Welcher Schatten passt?", "task": "Welcher der vier Schatten gehört genau zum Tier? Achte auf Ohren, Schwanz und Beine.", "teacher": "20 Sekunden still vergleichen.", "solution": "Nicht Gesamtform raten – Details prüfen.", "level": 1}, {"week": 9, "unit": "B", "type": "Geschichtenfehler", "icon": "📖", "title": "Da stimmt doch was nicht!", "task": "Höre die Mini-Geschichte. Entdecke 3 Dinge, die nicht zusammenpassen.", "teacher": "„Im Winter geht Leo im T-Shirt zum Schneemann. Die Sonne geht nachts um zwölf auf. Sein Fisch bellt laut.“", "solution": "T-Shirt im Schnee; Sonne nachts; Fisch bellt.", "level": 1}, {"week": 10, "unit": "A", "type": "Augenroute", "icon": "👀", "title": "Blick auf Reisen", "task": "Starte bei ⭐. Gehe im Raster: rechts – rechts – runter – links – runter. Wo landest du?", "teacher": "Nur mit den Augen, nicht zeigen. Danach Ziel nennen.", "solution": "Route langsam innerlich mitsprechen.", "level": 1}, {"week": 10, "unit": "B", "type": "Verbotenes Wort", "icon": "🚫", "title": "Bloß nicht sagen!", "task": "Beantworte Fragen, ohne „ja“ und „nein“ zu benutzen.", "teacher": "Fragen: Bist du in der Schule? Magst du Ferien? Ist 2+2=4?", "solution": "Antworten umformulieren, Impuls hemmen.", "level": 1}, {"week": 11, "unit": "A", "type": "Positionsgedächtnis", "icon": "📍", "title": "Wo war was?", "task": "Merke dir die Positionen von ⭐ 🍎 🔑 🐸 im 3×3-Feld. Dann wird verdeckt.", "teacher": "8 Sekunden ansehen, verdecken, Positionen beschreiben.", "solution": "Begriffe wie oben/unten/Mitte nutzen.", "level": 1}, {"week": 11, "unit": "B", "type": "Sortierfalle", "icon": "🧺", "title": "Ordnen trotz Ablenkung", "task": "Nenne nur die ROT gedachten Dinge als Tiere oder Nicht-Tiere – die Form ist egal.", "teacher": "Lehrkraft führt durch die angezeigten Symbole.", "solution": "Nur das relevante Merkmal beachten.", "level": 1}, {"week": 12, "unit": "A", "type": "Bewegungsspiegel", "icon": "🪞", "title": "Spiegel mich", "task": "Lehrkraft: rechte Hand hoch → du spiegelst mit linker Hand. Links tippen → rechts tippen.", "teacher": "6 Bewegungen langsam, dann Wechsel: plötzlich exakt nachmachen statt spiegeln.", "solution": "Regelwechsel deutlich ankündigen.", "level": 1}, {"week": 12, "unit": "B", "type": "Detailzoom", "icon": "🔬", "title": "Mini-Detail, große Wirkung", "task": "Welches große Bild enthält genau den gezeigten kleinen Ausschnitt?", "teacher": "30 Sekunden vergleichen. Begründung: Woran erkannt?", "solution": "Auf Form, Nachbarschaft und Richtung achten.", "level": 1}, {"week": 13, "unit": "A", "type": "Hör-Reihenfolge", "icon": "🎧", "title": "Ohren merken Reihen", "task": "Höre 5 Geräuschwörter: Klingel – Hund – Regen – Auto – Klatschen. Nenne sie in Reihenfolge.", "teacher": "Nur einmal vorlesen; danach gemeinsam rekonstruieren.", "solution": "Zusatz: rückwärts.", "level": 1}, {"week": 13, "unit": "B", "type": "Symboljäger", "icon": "💠", "title": "Jage nur das Ziel", "task": "Finde alle Kombinationen 🔺● direkt nebeneinander. Einzelne 🔺 oder ● zählen nich  'Bewegungsspiegel':'🪞 So geht’s: Die Lehrkraft macht eine Bewegung vor. Die Kinder machen sie spiegelverkehrt: rechte Lehrerhand bedeutet linke Kinderhand. Erst auf Signal wechseln.',
 'Detailzoom':'🔬 So geht’s: Das eine abweichende Detail still suchen. Nicht nur das Gesamtbild ansehen, sondern Feld für Feld vergleichen.',
 'Hör-Reihenfolge':'🎧 So geht’s: Die Lehrkraft liest die Begriffe einmal vor. Kinder hören ohne nachzusprechen. Danach nennen sie die Begriffe in derselben Reihenfolge.',
 'Symboljäger':'💠 So geht’s: Nur die vollständige vereinbarte Zeichenkombination zählt. Einzelne Zeichen nicht mitzählen. Systematisch von links nach rechts suchen.',
 'Gegenteil-Spiel':'↔️ So geht’s: Auf jedes Kommando bewusst das Gegenteil ausführen: „hoch“ → tief, „laut“ → leise usw. Erst denken, dann bewegen.',
 'Mini-Wimmelgeschichte':'🏙️ So geht’s: Das Bild zuerst still betrachten. Danach beantwortet die Klasse gezielte Fragen zum Bild und zeigt jeweils, woran sie ihre Antwort erkennt.',
 'Musterknacker':'🧩 So geht’s: Wiederholung in der Zeichenreihe entdecken. Das fehlende Zeichen nennen und anschließend die Musterregel in eigenen Worten erklären.',
 'Ablenkungsprofi':'👏 So geht’s: Nur auf das vereinbarte Zielbild reagieren: Bei 🐟 1× klatschen. Alle Ablenker ignorieren. In der nächsten Runde kann ein zweites Ziel hinzukommen.',
 'Wer lügt?':'🤔 So geht’s: Bild ansehen und danach jede Aussage einzeln prüfen. Genau eine Aussage passt nicht zum Bild. Falsche Aussage nennen und am Bild begründen.',
 'Paarfinder':'🃏 So geht’s: Karten genau vergleichen. Gesucht sind zwei vollständig identische Karten – gleiche Zeichen, gleiche Reihenfolge und gleiche Richtung.',
 'Richtungswechsel':'🧭 So geht’s: Keine Pfeiltasten! Die Pfeile sind nur Signale auf dem Bildschirm. Die Kinder führen die vereinbarte Gegenrichtung mit Blick oder Hand aus: ← bedeutet rechts, → bedeutet links usw.',
 'Silbenwächter':'🔤 So geht’s: Lehrkraft liest Wörter vor. Nur wenn ein Wort mit der vereinbarten Silbe beginnt, 1× klatschen. Ähnlich klingende Wörter zählen nicht.',
 'Foto-im-Kopf':'📸 So geht’s: Szene einige Sekunden genau ansehen. Dann verdecken. Lehrkraft stellt konkrete Fragen zu Anzahl, Position oder Gegenständen. Mit „Neue Runde“ erscheint eine neue Anordnung.',
 'Logikblick':'💡 So geht’s: Entscheiden, welches Zeichen nicht zu den anderen passt, und die Regel begründen. Wenn mehrere Lösungen möglich sind, zählt eine nachvollziehbare Begründung.',
 'Kettenauftrag':'⛓️ So geht’s: Die Lehrkraft spricht den gesamten mehrteiligen Auftrag. Kinder beginnen noch NICHT. Erst beim Wort „Los!“ führen sie alle Schritte in der richtigen Reihenfolge aus.',
 'Unsichtbare Veränderung':'✨ So geht’s: Bild A genau einprägen und dann verdecken. Nach dem Wechsel Bild B ansehen und Veränderungen benennen: Was fehlt, wurde vertauscht oder steht woanders?',
 'Fokus-Finale':'🏆 So geht’s: Drei kurze Aufgaben nacheinander lösen. Vor jeder Aufgabe wird die jeweilige Regel laut genannt. Nicht die Regel der vorherigen Aufgabe weiterverwenden.'
 };
 return rules[s.type]||'So geht’s: Auftrag vollständig anhören bzw. lesen, kurz denken und erst dann reagieren.';
}

function render(keepRound=false){
 stopTimer();remaining=900;covered=false;if(!keepRound)round=0;const s=slides[idx];
 const hideable=['Blitzblick','Was fehlt?','Reihenfolge-Profi','Positionsgedächtnis','Foto-im-Kopf','Unsichtbare Veränderung'].includes(s.type);
 document.getElementById('card').innerHTML=`
 <div class="top"><div><div class="kicker">Woche ${s.week} · Einheit ${s.unit}</div><div class="sub">${s.icon} ${esc(s.type)} · 15 Minuten · Klasse 2</div></div>
 <div class="timer"><span class="time" id="time">15:00</span><button class="secondary" id="tbtn" onclick="toggleTimer()">▶ Start</button><button class="secondary" onclick="resetTimer()">↺</button></div></div>
 <div class="mission">${s.icon} <span>${esc(s.title)}</span></div>
 <div class="problem"><div id="visual">${visual(s)}</div></div>
 <div class="text" style="margin:14px auto 4px;max-width:900px;text-align:center;font-size:18px;font-weight:800;line-height:1.45">${esc(exactRule(s))}</div>
 <div class="micro"><span>👀 <b>Fokussieren</b></span><span>🧠 <b>Erst denken</b></span><span>💬 <b>Dann lösen</b></span></div>
 <div class="teacher">👩‍🏫 <b>Durchführung:</b> ${esc(s.teacher)}<br><b>✓ Lösung/Hinweis:</b> ${esc(s.solution)}</div>
 <div class="controls"><button class="secondary" onclick="prev()">← vorherige Einheit</button>${hideable?'<button class="secondary" onclick="toggleCover()">🙈 Bild verdecken / zeigen</button>':''}${['Blitzblick','Was fehlt?','Fehlerdetektive','Detailzoom','Regelwechsel','Gegenteil-Spiel','Richtungswechsel','Zählfalle','Symboljäger','Positionsgedächtnis','Foto-im-Kopf','Ablenkungsprofi','Stopp & Los','Musterknacker','Logikblick','Reihenfolge-Profi','Hör-Reihenfolge'].includes(s.type)?'<button class="secondary" onclick="newRound()">🔀 Neue Runde</button>':''}<button class="primary" onclick="next()">nächste Einheit →</button></div>`;
 renderWeeks();
}
function toggleCover(){covered=!covered;document.getElementById('visual').innerHTML=visual(slides[idx]);}
function newRound(){round++;covered=false;document.getElementById('visual').innerHTML=visual(slides[idx]);const b=document.querySelector('.problem .text');if(b)b.insertAdjacentHTML('beforeend',`<span style="display:block;margin-top:10px;font-size:16px;color:#607078">🔀 Runde ${round+1}</span>`);}
function fmt(){let m=Math.floor(remaining/60),s=remaining%60;return `${m}:${String(s).padStart(2,'0')}`}
function tick(){remaining=Math.max(0,remaining-1);let e=document.getElementById('time');if(e)e.textContent=fmt();if(!remaining)stopTimer()}
function toggleTimer(){if(timer)stopTimer();else{timer=setInterval(tick,1000);document.getElementById('tbtn').textContent='⏸ Pause'}}
function stopTimer(){if(timer){clearInterval(timer);timer=null}let b=document.getElementById('tbtn');if(b)b.textContent='▶ Start'}
function resetTimer(){stopTimer();remaining=900;let e=document.getElementById('time');if(e)e.textContent='15:00'}
function next(){idx=Math.min(slides.length-1,idx+1);render()} function prev(){idx=Math.max(0,idx-1);render()}
function goWeek(w){idx=(w-1)*2;render()} render();
</script></body></html>
